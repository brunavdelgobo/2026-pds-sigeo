{% extends "base.html" %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card-single">
        <h3>Criar Nova Senha</h3>
        {% if validlink %}
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn-submit w-100">Confirmar Nova Senha</button>
            </form>
        {% else %}
            <div class="alert alert-danger text-center p-2 mb-3">Este link de recuperação é inválido ou já expirou.</div>
            <a href="{% url 'password_reset' %}" class="btn-submit d-inline-block text-decoration-none w-100">Solicitar novo link</a>
        {% endif %}
    </div>
</div>
{% endblock %}
