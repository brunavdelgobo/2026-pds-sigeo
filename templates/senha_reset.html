{% extends "base.html" %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card-single">
        <h3>Recuperar Senha</h3>
        <p>Digite seu e-mail cadastrado e enviaremos um link para você redefinir sua senha.</p>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-submit w-100">Enviar E-mail de Recuperação</button>
        </form>
    </div>
</div>
{% endblock %}
