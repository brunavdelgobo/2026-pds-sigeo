{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 card shadow-sm p-4">
        <h3 class="text-center">Recuperar Senha</h3>
        <p class="text-muted text-center">Digite seu e-mail cadastrado e enviaremos um link para você redefinir sua senha.</p>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100">Enviar E-mail de Recuperação</button>
        </form>
    </div>
</div>
{% endblock %}
