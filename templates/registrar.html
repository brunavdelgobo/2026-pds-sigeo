{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm p-4">
            <h3 class="text-center mb-4">Cadastrar Novo Usuário</h3>
            
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="btn btn-success w-100" type="submit">Salvar no Banco</button>
            </form>
            
            <p class="mt-3 text-center">
                <a href="/login/">Ir para o Login</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
