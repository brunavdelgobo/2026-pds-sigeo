{% extends "base.html" %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card-single">
        <h3>Cadastrar Novo Usuário</h3>
        <p>Preencha seus dados institucionais para acessar o SIGEO</p>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn-submit w-100" type="submit">Criar Conta</button>
        </form>

        <a href="/login/">Já tem uma conta? Ir para o Login</a>
    </div>
</div>
{% endblock %}
